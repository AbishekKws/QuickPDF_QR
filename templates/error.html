<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPDF QR | Upload Too Large</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6c63ff; --glass: rgba(255, 255, 255, 0.95); }
        html, body { height: 100%; margin: 0; }
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif; padding: 15px;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .error-card { background: var(--glass); border-radius: 28px; padding: 2.5rem; max-width: 480px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .error-card h1 { font-weight: 800; font-size: 2.6rem; margin-bottom: 0.5rem; color: #1a1a1a; }
        .error-card p { color: #555; font-weight: 600; }
        .btn-back { background: linear-gradient(135deg, #6c63ff 0%, #00bfff 100%); color: #fff; font-weight: 700; padding: 0.9rem 1.6rem; border-radius: 14px; text-decoration: none; display: inline-block; margin-top: 1.2rem; box-shadow: 0 10px 20px rgba(108, 99, 255, 0.3); }
        .btn-back:hover { color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>Oops! 😅</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn-back">&larr; Try Again</a>
    </div>
</body>
</html>
